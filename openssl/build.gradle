
plugins {
    id 'com.github.teruteru128.study.java-library-conventions'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // RIPEMD-160の突き合わせ相手。テストでしか使わない
    testImplementation 'org.bouncycastle:bcprov-jdk18on:1.86'
}

tasks.named('test') {
    // FFMでlibcryptoを叩くため。テストはクラスパス実行なのでALL-UNNAMED
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
